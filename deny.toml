# Configuração do cargo-deny para o Gota (GPL-3.0-only).
# Execute com: cargo deny check

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-linux-android",
]

[advisories]
version = 2
yanked = "warn"
# Avisos de "não mantido" só reprovam dependências diretas do workspace. Vulnerabilidades
# (RUSTSEC de segurança) continuam reprovando em todo o grafo, direto ou transitivo.
# Os crates abaixo aparecem de forma transitiva via Slint e foram reportados como não
# mantidos no CI; não são dependências diretas do Gota e não há exceção individual:
#   pin-utils (RUSTSEC-2026-0441), ttf-parser (RUSTSEC-2026-0192), zbus_names
#   (RUSTSEC-2026-0371), zvariant (RUSTSEC-2026-0370), zvariant_derive (RUSTSEC-2026-0372).
# Reavaliar a cada atualização do Slint.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
# Somente licenças compatíveis com GPL-3.0-only. Tudo que não estiver aqui é rejeitado,
# incluindo GPL-2.0-only, licenças proprietárias e licenças "LicenseRef-*".
# O Slint é licenciado como "GPL-3.0-only OR ...": a alternativa GPL-3.0-only é a usada.
# Unlicense (ex.: ksni, via Slint) é domínio público listado pela FSF como compatível com a GPL.
allow = [
    "GPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
